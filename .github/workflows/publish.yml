# Publishes to npm when a version tag is pushed (`npm run release:minor` and
# the others push one). npm trusts this workflow (Trusted publishing, set on
# the package's settings on npmjs.com), so no token is stored anywhere, and
# each version shows on npm as built from this repo (provenance).
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with 10.
      - run: npm install -g npm@11
      - run: npm ci
      # The tag must be the version in package.json.
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      # prepublishOnly builds the library; a prerelease (1.2.3-beta.0) goes
      # under the beta tag, so `npm install` keeps getting the latest release.
      - run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then npm publish --tag beta; else npm publish; fi
